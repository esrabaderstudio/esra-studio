<style>
/* Layout: sticky brand header + scrollable section tabs; content as stacked panels; sheets slide up for forms. */
:root{
  --bg:#111720;--surface:#19212d;--surface2:#1e2836;--ink:#e9edf3;--muted:#97a2b3;--line:#2a3545;
  --navy:#7aa7dc;--navy-ink:#0c1420;--copper:#e0a46d;--copper-soft:#3a2b1e;
  --ok:#6fcf9f;--ok-soft:#163328;--warn:#f0b862;--warn-soft:#3b2d16;--bad:#f08a80;--bad-soft:#3d1f1d;--info:#8fbaf0;--info-soft:#192b42;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.2);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:12px;padding:10px 16px 4px;max-width:1100px;margin:0 auto}
.brandrow img{width:44px;height:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}
.brandrow h1{font-family:var(--f-display);font-size:18px;margin:0;font-weight:700;color:var(--navy)}
.brandrow small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
.brandrow .sp{flex:1}
.save-state{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 12px 8px;max-width:1100px;margin:0 auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:transparent;padding:7px 14px;border-radius:999px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="true"]{background:var(--navy);color:var(--navy-ink)}
nav.tabs button:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding-block:18px 110px;padding-inline:16px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-size:20px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:16px;margin:0}
.secthead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.secthead .sp{flex:1}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:700;margin-top:2px}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500;margin-inline-start:4px}
.kpi.accent{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.kpi.accent .l,.kpi.accent .v small{color:inherit;opacity:.8}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .end{text-align:left;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.clickable{cursor:pointer}
.clickable:hover .t{color:var(--copper)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-info{background:var(--info-soft);color:var(--info)}.p-mute{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}.p-cop{background:var(--copper-soft);color:var(--copper)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--copper)}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.cop{background:var(--copper);color:#fff;border-color:var(--copper)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
.fab{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;width:56px;height:56px;border-radius:50%;border:0;background:var(--copper);color:#fff;font-size:28px;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);margin-bottom:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--copper-soft);border-color:var(--copper);color:var(--copper)}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.bar{height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--copper);border-radius:99px}
.money{font-weight:700}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,28,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:88vh}}
.sheet .sh-head{display:flex;align-items:center;gap:8px}
.sheet .sh-head h2{flex:1}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--copper);outline-offset:0;border-color:transparent}
[hidden]{display:none!important}
.sh-actions.field{flex-direction:row}
.sh-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start;position:sticky;bottom:-18px;background:var(--surface);padding-top:10px;border-top:1px solid var(--line)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13.5px;cursor:pointer;background:var(--surface2)}
.checks input{width:auto!important;flex:none;margin:0}
.checks label:has(input:checked){border-color:var(--copper);background:var(--copper-soft)}
.lines{display:flex;flex-direction:column;gap:8px}
.line{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;background:var(--surface2)}
.line .main{flex:1;min-width:0}
.line input{width:84px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--surface)}
.tot{display:flex;flex-direction:column;gap:4px;font-size:14px}
.tot div{display:flex;justify-content:space-between}
.tot .big{font-family:var(--f-display);font-size:18px;font-weight:700}
.tabletable{overflow-x:auto}
table.pr{width:100%;border-collapse:collapse;font-size:14px}
table.pr td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.pr td:last-child{width:130px}
table.pr input{width:120px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface2)}
.catbox summary{cursor:pointer;font-family:var(--f-display);font-weight:600;padding:6px 0}
.toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;z-index:60;font-weight:600;font-size:14px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
.inv-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#e9ecf1;padding:10px}
.inv-scale{transform-origin:top right;margin-inline:auto}
/* invoice document (fixed paper colors) — minimal, rules only, one quiet blue */
.inv{--t:#1f2329;--m:#6b7078;--l:#d9d9d4;--b:#1f4f8a;width:794px;min-height:1123px;background:#f8f7f3;color:var(--t);font-family:var(--f-body);direction:rtl;display:flex;flex-direction:column;padding:64px 70px 56px;font-size:13px;line-height:1.6;gap:0}
.inv .ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:46px}
.inv .ih h1{font-family:var(--f-display);font-size:46px;font-weight:600;color:var(--b);margin:0;line-height:1}
.inv .ih img{height:92px;width:auto}
.inv .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:44px}
.inv .k{font-size:12px;font-weight:700;color:var(--t);margin-bottom:4px}
.inv .top .to div{color:#3a3f47}
.inv .top .no{text-align:left;color:#3a3f47}
.inv .top .no b{font-weight:600;color:var(--t)}
.inv .proj{font-size:13px;color:var(--m);margin-bottom:10px}
.inv .proj b{color:var(--t);font-weight:600}
.inv table{width:100%;border-collapse:collapse;font-size:13px}
.inv thead th{text-align:right;font-weight:700;font-size:12px;padding:11px 10px;border-top:1.5px solid #555a61;border-bottom:1px solid #8a8f96}
.inv tbody td{padding:12px 10px;border-bottom:1px solid #8a8f96;vertical-align:top}
.inv td small{display:block;color:var(--m);font-size:11.5px;margin-top:1px}
.inv th.n,.inv td.n{text-align:center;width:80px}
.inv th.r,.inv td.r{text-align:left;width:105px;white-space:nowrap}
.inv td.num{display:table-cell}
.inv .sum{align-self:flex-end;width:300px;margin-top:6px}
.inv .sum div{display:flex;justify-content:space-between;padding:9px 10px;font-size:13px}
.inv .sum .lbl{font-weight:700}
.inv .sum .gt{border-top:1px solid #8a8f96;margin-top:2px;padding-top:12px;font-size:20px;font-weight:700}
.inv .sum .gt span:last-child{color:var(--b)}
.inv .pays .k{color:var(--t)}
.inv .sum .sm{font-size:12.5px;color:var(--m);padding-top:4px;padding-bottom:4px}
.inv .sum .rem{color:#a63a33;font-weight:700}
.inv .words{font-size:12px;color:var(--m);margin-top:10px}
.inv .pays{margin-top:18px;font-size:12px;color:var(--m)}
.inv .pays div{display:flex;gap:18px}
.inv .thanks{font-family:var(--f-display);font-size:24px;font-weight:500;margin:46px 0 0}
.inv .pm{margin-top:14px;font-size:12.5px;color:#3a3f47}
.inv .pm .k{display:inline;margin-inline-end:6px}
.inv .bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;padding-top:30px;padding-bottom:26px}
.inv .bottom .thanks{margin:0 0 6px}
.inv .slots{display:flex;gap:56px;align-items:flex-end}
.inv .slot{width:170px;display:flex;flex-direction:column;align-items:center}
.inv .slot .art{height:110px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.inv .slot img.sig{width:165px}
.inv .slot .st img{width:104px;transform:rotate(-8deg);opacity:.9}
.inv .slot .st span{position:absolute;bottom:4px;left:50%;transform:translateX(-50%) rotate(-8deg);font-family:var(--f-display);font-weight:700;color:#1d3f9a;font-size:10.5px;background:rgba(248,247,243,.85);padding:0 4px;white-space:nowrap}
.inv .slot .ln{width:100%;border-top:1px solid #8a8f96;margin-top:8px;padding-top:5px;text-align:center;font-size:11.5px;color:var(--m);font-weight:600}
.inv .ftr{border-top:1px solid var(--l);padding-top:12px;display:flex;justify-content:center;align-items:center;gap:12px;font-size:11.5px;color:var(--m);flex-wrap:wrap}
.inv .ftr i{width:3px;height:3px;border-radius:50%;background:#a5a9b0;display:inline-block}

/* modern template */
.invm{background:linear-gradient(180deg,#fbfaf7 0%,#eeece6 100%);padding:58px 52px 0;position:relative;overflow:hidden}
.invm .ring{position:absolute;top:-250px;left:-150px;width:400px;height:400px;border-radius:50%;border:40px solid transparent;background:linear-gradient(#f5f4f0,#f5f4f0) padding-box,linear-gradient(200deg,#f5f4f0 30%,#7fa7d4 70%,#1f4f8a) border-box;opacity:.55}
.invm>*{position:relative}
.invm .ih{margin-bottom:40px}
.invm .ih .br{display:flex;align-items:center;gap:10px}
.invm .ih .br img{height:58px;width:auto}
.invm .ih .br b{display:block;font-family:var(--f-display);font-size:16px;color:#16365e;direction:ltr;text-align:right}
.invm .ih .br span{font-size:11px;color:var(--m);direction:ltr;display:block}
.invm .ih h1{color:#16365e;font-size:48px}
.invm .k{font-family:var(--f-display);font-size:13px;color:#16365e;letter-spacing:.2px}
.invm .top{margin-bottom:34px}
.invm .top .no{text-align:left}
.invm .thd{display:grid;grid-template-columns:1fr 70px 100px 110px;gap:8px;background:linear-gradient(270deg,#16365e,#3f7cc0);color:#fff;border-radius:999px;padding:13px 26px;font-family:var(--f-display);font-weight:600;font-size:13px}
.invm .cd{background:#fff;border-radius:18px;border:0;box-shadow:none}
.invm .rows{margin-top:14px;padding:14px 26px}
.invm .tr{display:grid;grid-template-columns:1fr 70px 100px 110px;gap:8px;padding:10px 0;align-items:start}
.invm .tr+.tr{border-top:1px solid #efede8}
.invm .tr small{display:block;color:var(--m);font-size:11.5px}
.invm .n{text-align:center}.invm .r{text-align:left}
.invm .low{display:grid;grid-template-columns:1fr 320px;gap:22px;margin-top:18px;align-items:start}
.invm .lw{padding:8px 4px;font-size:12.5px;color:#3a3f47}
.invm .sum{padding:12px 22px;width:auto;margin:0;align-self:start}
.invm .sum div{display:flex;justify-content:space-between;padding:6px 0;font-family:var(--f-display);font-size:13px;font-weight:600;color:#16365e}
.invm .sum .gt{font-size:18px;border-top:0;margin:0;padding-top:6px}
.invm .sum .sm{font-family:var(--f-body);font-weight:400;color:var(--m);font-size:12.5px}
.invm .sum .rem{color:#a63a33;font-weight:700}
.invm .sgn{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding:24px 0 26px}
.invm .sgn .thanks{margin:0 0 6px;font-size:22px;color:#16365e}
.invm .slot .st span{background:rgba(240,238,233,.9)}
.invm .fband{margin:0 -52px;padding:26px 52px 30px;background:linear-gradient(90deg,#16365e 0%,#7fa7d4 45%,rgba(238,236,230,0) 100%)}
.invm .fpill{background:#122a49;color:#e6edf6;border-radius:999px;padding:13px 28px;display:flex;justify-content:space-between;gap:16px;font-size:12px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (max-width:520px){.kpi .v{font-size:20px}.row{gap:8px}}
</style>

  setSave('جاري الحفظ…');try{await DB.doc('config/'+name).set(obj);setSave('تم الحفظ ✓')}catch(e){setSave('تعذر الحفظ')}
}

/* ===================== حسابات ===================== */
function orderTotals(o){
  const sub=(o.items||[]).length?(o.items||[]).reduce((a,i)=>a+n(i.qty||1)*n(i.price),0):n(o.amount);
  const disc=n(o.discount);const total=Math.max(0,sub-disc);
  const paid=(o.payments||[]).reduce((a,p)=>a+n(p.amount),0);
  return {sub,disc,total,paid,rem:total-paid};
}
function subInfo(s){
  const t=today();const left=daysBetween(t,s.end||t);
  let st=['active','ساري','p-ok'];
  if(!s.end)st=['active','ساري','p-ok'];
  else if(left<0)st=['expired','منتهي','p-bad'];
  else if(left<=7)st=['soon','ينتهي قريباً','p-warn'];
  const paid=(s.payments||[]).reduce((a,p)=>a+n(p.amount),0);
  return {left,st,paid,rem:n(s.amount)-paid};
}
/* كل حركات المال: دفعات الطلبات + دفعات الاشتراكات + الحركات اليدوية */
function moneyFlow(){
  const out=[];
  S.orders.forEach(o=>(o.payments||[]).forEach(p=>out.push({date:p.date,type:'in',amount:n(p.amount),activity:'الاستوديو',category:'دفعة طلب',method:p.method,note:`${o.title||'طلب'} — ${clientName(o.clientId)}`,auto:true})));
  S.subs.forEach(s=>(s.payments||[]).forEach(p=>out.push({date:p.date,type:'in',amount:n(p.amount),activity:'الاستوديو',category:'اشتراك '+(s.kind==='excel'?'منظومة':'QR'),method:p.method,note:`${s.service||''} — ${clientName(s.clientId)}`,auto:true})));
  S.contracts.forEach(c=>(c.payments||[]).forEach(p=>out.push({date:p.date,type:'in',amount:n(p.amount),activity:'الاستوديو',category:'عقد شهري',method:p.method,note:`${c.title||''} — ${clientName(c.clientId)}`,auto:true})));
  S.finance.forEach(f=>out.push({...f,amount:n(f.amount)}));
  return out.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}
function monthSums(m){const f=moneyFlow().filter(x=>ym(x.date)===m);const inc=f.filter(x=>x.type==='in').reduce((a,x)=>a+x.amount,0);const exp=f.filter(x=>x.type==='out').reduce((a,x)=>a+x.amount,0);return {inc,exp,net:inc-exp,rows:f}}
function goalProgress(g){
  const m=ym(today());
  switch(g.kind){
    case 'income_month':return monthSums(m).inc;
    case 'net_month':return monthSums(m).net;
    case 'clients':return S.clients.length;
    case 'orders_month':return S.orders.filter(o=>ym(o.date)===m).length;
    case 'subs_active':return S.subs.filter(s=>subInfo(s).st[0]!=='expired').length;
    default:return n(g.current);
  }
}

/* ===================== العقود الشهرية ===================== */
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function contractInfo(c){
  const start=c.start||today();const end=c.end||addMonths(start,n(c.months)||1);
  const qty=n(c.qty)||0;const days=(c.days||[]).map(Number);
  let dates=[];const d=new Date(start+'T00:00');const e=new Date(end+'T00:00');
  if(c.mode==='weekly'){while(d<e){dates.push(isoOf(d));d.setDate(d.getDate()+7)}}
  else{while(d<e){if(days.includes(d.getDay()))dates.push(isoOf(d));d.setDate(d.getDate()+1)}}
  const L=dates.length||1;const base=Math.floor(qty/L),extra=qty%L;
  const plan=dates.map((x,i)=>({date:x,count:base+(i<extra?1:0)})).filter(p=>p.count>0);
  const dels=(c.deliveries||[]).filter(x=>x.date>=start&&x.date<end);
  const delivered=dels.reduce((a,x)=>a+n(x.count),0);
  const t=today();const dueByNow=plan.filter(p=>p.date<=t).reduce((a,p)=>a+p.count,0);
  let cum=0;let next=null;for(const p of plan){cum+=p.count;if(cum>delivered){next={...p,date:p.date};break}}
  const paid=(c.payments||[]).filter(p=>p.period?p.period===start:(p.date>=start&&p.date<end)).reduce((a,p)=>a+n(p.amount),0);
  let st=['active','ساري','p-ok'];
  if(qty&&delivered>=qty)st=['done','اكتمل التسليم','p-info'];
  else if(t>=end)st=['ended','انتهت المدة','p-bad'];
  else if(dueByNow>delivered)st=['late','متأخر '+(dueByNow-delivered),'p-warn'];
  return {start,end,qty,plan,dels,delivered,dueByNow,next,paid,rem:n(c.price)-paid,st};
}
function contractRow(c){const i=contractInfo(c);const pct=i.qty?Math.min(100,i.delivered/i.qty*100):0;
  return `<div class="row clickable" data-act="contract" data-id="${c.id}" style="flex-direction:column;align-items:stretch;gap:6px"><div style="display:flex;gap:8px;align-items:flex-start"><div class="main"><div class="t">${esc(c.title||'عقد')} — ${esc(clientName(c.clientId))}</div><div class="s">${c.mode==='weekly'?'تسليم أسبوعي':'أيام التسليم: '+(c.days||[]).map(x=>WD[x]).join('، ')} · ${fdate(i.start)} ← ${fdate(i.end)}</div></div><div class="end"><span class="pill ${i.st[2]}">${i.st[1]}</span>${i.rem>0.001?`<span class="s">باقي <b class="num" style="color:var(--bad)">${fmt(i.rem)}</b></span>`:''}</div></div>
  <div class="bar"><i style="width:${pct}%"></i></div><div class="s" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span>سُلّم <b class="num">${i.delivered}</b> من <b class="num">${i.qty}</b></span>${i.next&&i.st[0]!=='ended'?`<span>· التسليم الجاي ${WD[new Date(i.next.date+'T00:00').getDay()]} ${fdate(i.next.date)}</span>`:''}<span class="sp" style="flex:1"></span>${i.st[0]!=='done'&&i.st[0]!=='ended'?`<button class="btn sm cop" data-act="deliver" data-id="${c.id}">سلّمت اليوم</button>`:''}</div></div>`}
function vContracts(){
  const RK={late:0,active:1,done:2,ended:3};const key=c=>{const i=contractInfo(c);return [RK[i.st[0]],i.next?i.next.date:i.end]};
  const list=S.contracts.slice().sort((a,b)=>{const x=key(a),y=key(b);return x[0]-y[0]||x[1].localeCompare(y[1])});
  const act=list.filter(c=>contractInfo(c).st[0]!=='ended');const old=list.filter(c=>contractInfo(c).st[0]==='ended');
  return `<div class="secthead"><h2>العقود الشهرية</h2><div class="sp"></div><button class="btn primary" data-act="contract">+ عقد جديد</button></div>
  <p class="muted" style="margin:0">للعملاء اللي يتفقوا معاك على عدد تصاميم أو فيديوهات كل شهر، مع أيام تسليم ثابتة أو حسب وقتك.</p>
  <div class="card"><div class="list">${act.length?act.map(contractRow).join(''):empty('ما فيش عقود شغالة','مثلاً: 12 تصميم في الشهر، تسليم أيام الأحد والثلاثاء والخميس.','contract','+ عقد جديد')}</div></div>
  ${old.length?`<div class="card"><h3>عقود انتهت مدتها</h3><div class="list">${old.map(contractRow).join('')}</div></div>`:''}`;
}
async function quickDeliver(id){const c=S.contracts.find(x=>x.id===id);if(!c)return;const i=contractInfo(c);const cnt=i.next&&i.next.date<=today()?Math.max(1,i.dueByNow-i.delivered):(i.next?i.next.count:1);
  const rec=JSON.parse(JSON.stringify(c));rec.deliveries=rec.deliveries||[];rec.deliveries.push({date:today(),count:cnt});await put('contracts',rec);toast(`تم تسجيل تسليم ${cnt}`)}

/* ===================== التنقل ===================== */
const TABS=[['home','الرئيسية'],['orders','الطلبات والمشاريع'],['contracts','العقود الشهرية'],['clients','العملاء'],['subs','اشتراكات QR والمنظومات'],['tasks','المهام'],['goals','الأهداف'],['money','الأرباح والمصاريف'],['prices','الخدمات والأسعار'],['settings','الإعدادات']];
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" aria-current="${k===tab}">${l}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;try{localStorage.setItem('eb_tab',tab)}catch(e){}render();window.scrollTo({top:0})});
  const fabMap={home:'order',orders:'order',contracts:'contract',clients:'client',subs:'sub',tasks:'task',goals:'goal',money:'money'};
  const f=$('#fab');f.hidden=!fabMap[tab];f.onclick=()=>({contract:()=>openContract(),order:()=>openOrder(),client:()=>openClient(),sub:()=>openSub(),task:()=>openTask(),goal:()=>openGoal(),money:()=>openMoney()})[fabMap[tab]]();
}
function render(){
  renderTabs();
  const v={home:vHome,orders:vOrders,contracts:vContracts,clients:vClients,subs:vSubs,tasks:vTasks,goals:vGoals,money:vMoney,prices:vPrices,settings:vSettings}[tab]||vHome;
  $('#main').innerHTML=(OFFLINE?`<div class="banner">ما فيش اتصال بقاعدة البيانات توا. تأكدي من الإنترنت.</div>`:'')+v();
  bindMain();
}
function bindMain(){
  document.querySelectorAll('[data-act]').forEach(el=>el.onclick=e=>{e.stopPropagation();ACT[el.dataset.act](el.dataset.id,el)});
  document.querySelectorAll('[data-f]').forEach(el=>el.onclick=()=>{filt[el.dataset.f]=el.dataset.v;render()});
  const q=$('#q');if(q){q.oninput=()=>{filt.q=q.value;const pos=q.selectionStart;render();const nq=$('#q');nq.focus();nq.setSelectionRange(pos,pos)}}
  document.querySelectorAll('[data-price]').forEach(inp=>inp.onchange=()=>{const p={...S.prices};const v=inp.value.trim();if(v==='')delete p[inp.dataset.price];else p[inp.dataset.price]=n(v);putCfg('prices',p)});
  const sf=$('#setForm');if(sf)sf.onsubmit=e=>{e.preventDefault();const fd=new FormData(sf);const o={...settings()};['studio','tagline','phone','whatsapp','facebook','address','payNote','invNote'].forEach(k=>o[k]=fd.get(k)||'');o.activities=(fd.get('activities')||'').split('\n').map(x=>x.trim()).filter(Boolean);if(!o.activities.length)o.activities=['الاستوديو'];putCfg('settings',o);toast('تم حفظ الإعدادات')};
  const imp=$('#impFile');if(imp)imp.onchange=()=>{const f=imp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{const m=$('#impMsg');try{const j=JSON.parse(r.result);const d=j.data||j;if(!DB){m.textContent='لازم تكوني متصلة بالإنترنت';return}let n=0;for(const c of Object.keys(d)){for(const id of Object.keys(d[c]||{})){await DB.doc(c+'/'+id).set(d[c][id]);n++}}m.textContent='تم نقل '+n+' سجل ✓'}catch(e){m.textContent='الملف غير صالح'}};r.readAsText(f);imp.value=''};

/* ===================== النوافذ ===================== */
function sheet(html,onReady){
  const host=$('#sheetHost');host.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')close()};
  host.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  document.onkeydown=e=>{if(e.key==='Escape')close()};
  onReady&&onReady(host.querySelector('.sheet'));
  const f=host.querySelector('input,select,textarea');if(f&&matchMedia('(min-width:760px)').matches)f.focus();
}
function close(){$('#sheetHost').innerHTML='';document.onkeydown=null}

function openClientView(id){if(!id)return openClient();const c=S.clients.find(x=>x.id===id);if(!c)return;

function priceFor(cat,service,dur,extras){const P=S.prices;let p=n(P[cat+'|'+service]);if(dur)p+=n(P['dur|'+dur]);(extras||[]).forEach(x=>p+=n(P[cat+'|x|'+x]));return p}
function totHTML(o){const t=orderTotals(o);

  return `<div><span>المجموع</span><span>${LYD(t.sub)}</span></div><div><span>الخصم</span><span>${LYD(t.disc)}</span></div><div class="big"><span>الإجمالي</span><span>${LYD(t.total)}</span></div><div><span>المدفوع</span><span style="color:var(--ok)">${LYD(t.paid)}</span></div>`+remRow}

    box.querySelector('#pays').innerHTML=(o.payments||[]).map((p,i)=>`<div class="line"><div class="main"><b class="num">${fmt(p.amount)}</b> د.ل · ${esc(p.method)} · ${fdate(p.date)}</div><button class="btn sm ghost danger" type="button" data-rmp="${i}" aria-label="حذف الدفعة">✕</button></div>`).join('')||'<div class="muted" style="font-size:13px">ما فيش دفعات مسجلة</div>';
    box.querySelector('#tot').innerHTML=totHTML(o);box.querySelector('#amtBox').hidden=o.items.length>0;
    box.querySelectorAll('[data-q]').forEach(el=>el.oninput=()=>{o.items[el.dataset.q].qty=n(el.value)||1;drawTot(box)});

    return `<div class="field"><label for="bCat">القسم</label><select id="bCat">${CAT_KEYS.map(x=>`<option value="${x}" ${x===k?'selected':''}>${CAT[x].name}</option>`).join('')}</select></div>
    ${c.multi?`<div class="field full"><label>اختاري مكونات الهوية المطلوبة</label><div class="checks">${c.services.map(s=>`<label><input type="checkbox" name="bMulti" value="${esc(s)}">${esc(s)}</label>`).join('')}</div></div>`
    :`<div class="field"><label for="bSvc">الخدمة</label><select id="bSvc">${c.services.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div>

    <div class="field ${c.multi?'':''}"><label for="bNote">تفاصيل (اختياري)</label><input id="bNote" placeholder="${k==='other'?'اكتبي اسم الخدمة':'مثلاً: 3 مقترحات، لون أزرق…'}"></div>
    <div class="field" style="justify-content:flex-end"><button class="btn cop" type="button" id="bAdd">+ أضيفي للطلب</button></div>`};

    <div class="field"><label for="o2">الحالة</label><select id="o2" name="status">${STATUSES.map(s=>`<option value="${s[0]}" ${s[0]===o.status?'selected':''}>${s[1]}</option>`).join('')}</select></div>
    <div class="field"><label for="o3">تاريخ الطلب</label><input id="o3" type="date" name="date" value="${esc(o.date)}"></div>

    <div class="field full"><h3>الخدمات في الطلب</h3></div>
    <div class="field full"><div class="lines" id="lines"></div></div>

  </form>`,box=>{

const _stampCache={};const embImg=new Image();embImg.src=EMB;
function stampURL(date){
  if(_stampCache[date]&&embImg.complete)return _stampCache[date];
  const S2=420,c=document.createElement('canvas');c.width=c.height=S2;const x=c.getContext('2d');const col='#1f4f8a';const cx=S2/2;
  x.strokeStyle=col;x.fillStyle=col;x.globalAlpha=.9;
  x.lineWidth=7;x.beginPath();x.arc(cx,cx,200,0,7);x.stroke();
  x.lineWidth=3;x.beginPath();x.arc(cx,cx,186,0,7);x.stroke();
  x.beginPath();x.arc(cx,cx,128,0,7);x.stroke();
  const arcText=(txt,r,startAng,dir)=>{x.font='600 34px "Readex Pro",sans-serif';x.textAlign='center';x.textBaseline='middle';const chars=[...txt];const step=dir*0.165;let a=startAng-step*(chars.length-1)/2;chars.forEach(ch=>{x.save();x.translate(cx+r*Math.cos(a),cx+r*Math.sin(a));x.rotate(a+(dir>0?Math.PI/2:-Math.PI/2));x.fillText(ch,0,0);x.restore();a+=step})};
  arcText('ESRA BADER STUDIO',157,-Math.PI/2,1);
  arcText('• LIBYA •',157,Math.PI/2,-1);
  if(embImg.complete&&embImg.naturalWidth){x.globalAlpha=.85;const w=150,h=w*embImg.naturalHeight/embImg.naturalWidth;
    const t=document.createElement('canvas');t.width=w;t.height=h;const tx=t.getContext('2d');tx.drawImage(embImg,0,0,w,h);tx.globalCompositeOperation='source-in';tx.fillStyle=col;tx.fillRect(0,0,w,h);
    x.drawImage(t,cx-w/2,cx-h/2-26,w,h);x.globalAlpha=.9}
  x.font='700 30px "Readex Pro",sans-serif';x.fillText(date.split('-').reverse().join('/'),cx,cx+66);
  const u=c.toDataURL('image/png');_stampCache[date]=u;return u;
}

function tafqeet(num){
  num=Math.floor(Math.abs(n(num)));if(!num)return 'صفر';
  const O=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const T=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const H=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  const u1000=x=>{const h=Math.floor(x/100),r=x%100;const p=[];if(h)p.push(H[h]);if(r){if(r<20)p.push(O[r]);else{const u=r%10,t=Math.floor(r/10);p.push(u?O[u]+' و'+T[t]:T[t])}}return p.join(' و')};
  const grp=(x,one,two,few,many)=>x===1?one:x===2?two:x<=10?u1000(x)+' '+few:u1000(x)+' '+many;
  const m=Math.floor(num/1e6),k=Math.floor(num%1e6/1000),r=num%1000;const p=[];
  if(m)p.push(grp(m,'مليون','مليونان','ملايين','مليون'));if(k)p.push(grp(k,'ألف','ألفان','آلاف','ألف'));if(r)p.push(u1000(r));
  return p.join(' و');
}
function invoiceData(kind,rec){

  const D=iso=>iso?iso.split('-').reverse().join('/'):'';
  if(kind==='order'){const t=orderTotals(rec);sub=t.sub;disc=t.disc;total=t.total;paid=t.paid;pays=rec.payments||[];subject=rec.title;subLine=rec.deadline?'التسليم '+D(rec.deadline):'';
    items=!(rec.items||[]).length?[{name:rec.title||'',det:'',q:1,u:n(rec.amount),t:n(rec.amount)}]:(rec.items||[]).map(it=>({name:it.service,det:[CAT[it.cat]?.name,it.duration,...(it.options||[]),it.note].filter(Boolean).join(' · '),q:n(it.qty||1),u:n(it.price),t:n(it.qty||1)*n(it.price)}));}
  else if(kind==='contract'){const i=contractInfo(rec);sub=total=n(rec.price);paid=i.paid;pays=(rec.payments||[]).filter(p=>p.period?p.period===i.start:(p.date>=i.start&&p.date<i.end));subject=rec.title||rec.service;subLine='من '+D(i.start)+' إلى '+D(i.end);
    items=[{name:rec.service+' — عقد شهري',det:[CAT[rec.cat]?.name,rec.mode==='weekly'?'تسليم أسبوعي':'التسليم أيام '+(rec.days||[]).map(x=>WD[x]).join('، ')].join(' · '),q:i.qty,u:i.qty?total/i.qty:0,t:total}]}
  else{const i=subInfo(rec);const pl=PLANS.find(p=>p[0]===rec.plan);sub=total=n(rec.amount);paid=i.paid;pays=rec.payments||[];subject=rec.service;subLine='من '+D(rec.start)+' إلى '+D(rec.end);
    items=[{name:rec.service,det:['اشتراك '+(pl?pl[1]:''),rec.target].filter(Boolean).join(' · '),q:1,u:total,t:total}]}

    const imgH=cv.height*W/cv.width;let y=0;const data=cv.toDataURL('image/jpeg',.93);
    pdf.addImage(data,'JPEG',0,0,W,imgH);while(imgH-y>H+2){y+=H;pdf.addPage();pdf.addImage(data,'JPEG',0,-y,W,imgH)}
    host.innerHTML='';
    const blob=pdf.output('blob');const cname=(clientName(rec.clientId)||'').replace(/[\\/:*?"<>|]/g,'');
    const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=`فاتورة ${rec.invNo} - ${cname}.pdf`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);msg.textContent='تم تجهيز الفاتورة ✓'
  }catch(e){msg.textContent='صار خطأ في تجهيز الملف، حاولي مرة ثانية'}
  finally{btn.disabled=false}
}

/* ===================== التشغيل ===================== */
render();
window.__studio={
  start(db){DB=db;OFFLINE=false;setSave('متصل ✓');
    COLLS.forEach(k=>DB.collection(k).onSnapshot(snap=>{S[k]=snap.docs.map(d=>({id:d.id,...d.data()}));render()},()=>setSave('انقطع الاتصال')));
    ['settings','prices'].forEach(k=>DB.doc('config/'+k).onSnapshot(snap=>{S[k]=snap.exists?snap.data():{};render()},()=>{}));},
  stop(){DB=null;COLLS.forEach(k=>S[k]=[]);S.settings={};S.prices={};render()},
  setSave
};
</script>

const gate=$('gate'), form=$('gateForm'), err=$('g_err');
const pack=o=>({j:JSON.stringify(o)});
const unpack=v=>{try{return JSON.parse(v.j)}catch(e){return {}}};
let subs=[];
function makeDB(uid){
  const base='users/'+uid+'/';
  return {
    doc(path){const r=ref(db,base+path);return{
      set:o=>{const c={...o};delete c.id;return set(r,pack(c))},
      delete:()=>remove(r),
      onSnapshot:(cb,er)=>{const u=onValue(r,s=>{const v=s.val();cb({exists:!!v,data:()=>v?unpack(v):undefined})},er);subs.push(u);return u}
    }},
    collection(path){const r=ref(db,base+path);return{
      onSnapshot:(cb,er)=>{const u=onValue(r,s=>{const v=s.val()||{};cb({docs:Object.keys(v).map(id=>({id,data:()=>unpack(v[id])}))})},er);subs.push(u);return u}
    }}
  };
}
setPersistence(auth,browserLocalPersistence).catch(()=>{});
onAuthStateChanged(auth,user=>{
  subs.forEach(u=>{try{u()}catch(e){}});subs=[];

  else{window.__studio.stop();$('gateWait').hidden=true;form.hidden=false;gate.hidden=false;$('logoutBtn').hidden=true}
});

});
